<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #080808;
    color: #ddd;
    font-family: Arial, sans-serif;
}


/* CHAT */

.chat {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    background: #080808;
}


/* HEADER */

.header {
    height: 58px;
    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding: 0 16px;

    border-bottom: 1px solid #1b1b1b;
}

.status {
    width: 7px;
    height: 7px;

    margin-right: 10px;

    border-radius: 50%;

    background: #444;
}

.title {
    font-size: 14px;
}

.online {
    margin-left: auto;

    color: #444;

    font-size: 10px;
    letter-spacing: 1px;
}


/* MENSAGENS */

.messages {
    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 20px;

    display: flex;
    flex-direction: column;
    gap: 10px;
}


/* BALÕES */

.message {
    max-width: 75%;

    padding: 10px 13px;

    border-radius: 10px;

    font-size: 14px;
    line-height: 1.4;

    word-wrap: break-word;
}

.bot {
    align-self: flex-start;

    background: #101010;

    border: 1px solid #191919;

    color: #aaa;

    border-bottom-left-radius: 3px;
}

.user {
    align-self: flex-end;

    background: #1b1b1b;

    color: #eee;

    border-bottom-right-radius: 3px;
}


/* HORÁRIO */

.time {
    display: block;

    margin-top: 5px;

    font-size: 9px;

    color: #444;

    text-align: right;
}


/* ÁREA DE ESCRITA */

.input-area {
    width: 100%;

    flex-shrink: 0;

    padding: 10px;

    display: flex;
    gap: 8px;

    border-top: 1px solid #1b1b1b;

    background: #090909;
}


/* CAMPO */

.input {
    flex: 1;

    min-width: 0;

    height: 44px;

    padding: 0 14px;

    border: 1px solid #222;

    border-radius: 9px;

    outline: none;

    background: #111;

    color: #ddd;

    font-size: 14px;
}

.input::placeholder {
    color: #444;
}

.input:focus {
    border-color: #333;
}


/* BOTÃO */

.send {
    width: 44px;
    height: 44px;

    flex-shrink: 0;

    border: 1px solid #222;

    border-radius: 9px;

    background: #151515;

    color: #aaa;

    font-size: 18px;

    cursor: pointer;
}

.send:hover {
    background: #202020;
}

.send:active {
    transform: scale(.95);
}


/* DIGITANDO */

.typing {
    display: none;

    align-self: flex-start;

    padding: 9px 12px;

    background: #101010;

    border: 1px solid #191919;

    border-radius: 10px;

    color: #444;
}

.typing.active {
    display: block;
}


/* CELULAR */

@media (max-width: 600px) {

    .messages {
        padding: 15px 10px;
    }

    .message {
        max-width: 85%;
    }

    .input-area {
        padding: 8px;
    }

}

</style>
</head>


<body>


<div class="chat">


    <!-- CABEÇALHO -->

    <header class="header">

        <div class="status"></div>

        <div class="title">
            desconhecido
        </div>

        <div class="online">
            online
        </div>

    </header>



    <!-- MENSAGENS -->

    <main
        class="messages"
        id="messages"
    >

        <div class="message bot">

            Você está aí?

            <span class="time">
                agora
            </span>

        </div>


        <div
            class="typing"
            id="typing"
        >
            ...
        </div>

    </main>



    <!-- CAMPO DE ENVIO -->

    <form
        class="input-area"
        id="chatForm"
    >

        <input
            id="messageInput"
            class="input"
            type="text"
            placeholder="Digite uma mensagem..."
            autocomplete="off"
        >

        <button
            class="send"
            type="submit"
        >
            ↑
        </button>

    </form>


</div>



<script>

/* ELEMENTOS */

const form = document.getElementById("chatForm");

const input = document.getElementById("messageInput");

const messages = document.getElementById("messages");



/* HORÁRIO */

function getTime() {

    const now = new Date();

    return now.toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}



/* PROTEÇÃO CONTRA HTML */

function escapeHTML(text) {

    const element = document.createElement("div");

    element.textContent = text;

    return element.innerHTML;

}



/* ADICIONAR MENSAGEM */

function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.innerHTML =
        escapeHTML(text) +
        `<span class="time">${getTime()}</span>`;

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;

}



/* ENVIO */

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const text = input.value.trim();

    if (text === "") {
        return;
    }

    addMessage(text, "user");

    input.value = "";

    input.focus();

});



/*
==================================================
 FUNÇÃO PARA O FUTURO BOT
==================================================

 Depois você poderá criar um bot.js e fazer:

 addBotMessage("alguma coisa");

*/

function addBotMessage(text) {

    addMessage(text, "bot");

}



/*
==================================================
 TESTE

 Abra o console do navegador e execute:

 addBotMessage("Eu estava esperando você.");

 Isso adicionará uma mensagem do bot.

==================================================
*/

</script>

</body>
</html>
