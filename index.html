<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #080808;
            color: #eee;
        }

        body {
            display: flex;
            justify-content: center;
        }

        .chat {
            width: 100%;
            max-width: 700px;
            height: 100dvh;

            display: flex;
            flex-direction: column;

            background: #0d0d0d;
        }

        /* HEADER */

        .header {
            flex-shrink: 0;

            height: 60px;
            padding: 0 18px;

            display: flex;
            align-items: center;

            border-bottom: 1px solid #1d1d1d;
            background: #0b0b0b;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 14px;
            color: #888;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #777;
        }

        /* MENSAGENS */

        .messages {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding: 20px 16px;

            display: flex;
            flex-direction: column;
            gap: 12px;

            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }

        .message {
            max-width: 80%;

            padding: 11px 14px;

            border-radius: 14px;

            line-height: 1.45;
            font-size: 15px;

            word-wrap: break-word;

            animation: messageAppear 0.2s ease;
        }

        .bot {
            align-self: flex-start;

            background: #181818;
            border: 1px solid #242424;

            color: #ddd;

            border-bottom-left-radius: 4px;
        }

        .user {
            align-self: flex-end;

            background: #252525;

            color: #eee;

            border-bottom-right-radius: 4px;
        }

        .time {
            display: block;

            margin-top: 5px;

            font-size: 10px;
            color: #666;

            text-align: right;
        }

        /* DIGITANDO */

        .typing {
            display: none;

            align-self: flex-start;

            padding: 10px 14px;

            background: #181818;

            border: 1px solid #242424;

            border-radius: 14px;
            border-bottom-left-radius: 4px;
        }

        .typing span {
            display: inline-block;

            width: 5px;
            height: 5px;

            margin: 0 2px;

            border-radius: 50%;

            background: #777;

            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .2s;
        }

        .typing span:nth-child(3) {
            animation-delay: .4s;
        }

        /* INPUT */

        .input-area {
            flex-shrink: 0;

            display: flex;
            gap: 8px;

            padding: 12px;

            padding-bottom: max(
                12px,
                env(safe-area-inset-bottom)
            );

            border-top: 1px solid #1d1d1d;

            background: #0b0b0b;
        }

        #messageInput {
            flex: 1;

            min-width: 0;

            height: 44px;

            padding: 0 14px;

            border: 1px solid #252525;
            border-radius: 22px;

            outline: none;

            background: #151515;
            color: #eee;

            font-size: 15px;
        }

        #messageInput:focus {
            border-color: #383838;
        }

        #sendButton {
            width: 44px;
            height: 44px;

            flex-shrink: 0;

            border: none;
            border-radius: 50%;

            background: #ddd;
            color: #111;

            cursor: pointer;

            font-size: 18px;
        }

        #sendButton:active {
            transform: scale(.94);
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: .3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        @media (max-width: 500px) {
            .message {
                max-width: 86%;
                font-size: 14px;
            }

            .messages {
                padding: 14px 10px;
            }
        }
    </style>
</head>

<body>

<div class="chat">

    <header class="header">
        <div class="status">
            <span class="status-dot"></span>
            <span>desconhecido</span>
        </div>
    </header>

    <main id="messages" class="messages">

        <div class="message bot">
            Você demorou.
            <span class="time">agora</span>
        </div>

        <div id="typing" class="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </main>

    <form id="chatForm" class="input-area">

        <input
            id="messageInput"
            type="text"
            autocomplete="off"
            placeholder="Escreva..."
        >

        <button id="sendButton" type="submit">
            ↑
        </button>

    </form>

</div>

<script src="bot.js"></script>

<script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const typing = document.getElementById("typing");

    function getTime() {
        return new Date().toLocaleTimeString("pt-BR", {
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function addMessage(text, type) {
        const message = document.createElement("div");

        message.className = `message ${type}`;

        message.innerHTML = `
            ${escapeHTML(text)}
            <span class="time">${getTime()}</span>
        `;

        messages.insertBefore(message, typing);

        messages.scrollTop = messages.scrollHeight;
    }

    function escapeHTML(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    function showTyping() {
        typing.style.display = "block";
        messages.scrollTop = messages.scrollHeight;
    }

    function hideTyping() {
        typing.style.display = "none";
    }

    async function sendMessage() {

        const text = input.value.trim();

        if (!text) return;

        addMessage(text, "user");

        input.value = "";

        input.focus();

        showTyping();

        /*
         * O cérebro do bot está no bot.js.
         */
        const response = await HorrorBot.respond(text);

        /*
         * Pequeno atraso para a conversa não parecer
         * uma resposta instantânea de programa.
         */
        const delay = 350 + Math.random() * 800;

        setTimeout(() => {

            hideTyping();

            addMessage(response, "bot");

        }, delay);
    }

    form.addEventListener("submit", event => {

        event.preventDefault();

        sendMessage();

    });

    input.addEventListener("keydown", event => {

        if (event.key === "Enter" && !event.shiftKey) {

            event.preventDefault();

            sendMessage();

        }

    });
</script>

</body>
</html>
