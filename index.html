<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #080808;
    color: #d8d8d8;
    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* =========================================================
   CHAT
========================================================= */

.chat {
    width: min(100%, 520px);
    height: 100vh;
    max-height: 850px;

    background: #0b0b0b;

    display: flex;
    flex-direction: column;

    border-left: 1px solid #171717;
    border-right: 1px solid #171717;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    height: 58px;
    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding: 0 18px;

    border-bottom: 1px solid #181818;

    background: #0a0a0a;
}

.status {
    width: 7px;
    height: 7px;

    margin-right: 10px;

    border-radius: 50%;

    background: #555;
}

.header-title {
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.5px;
}

.header-status {
    margin-left: auto;

    font-size: 10px;
    color: #555;

    letter-spacing: 1px;
}


/* =========================================================
   ÁREA DE MENSAGENS
========================================================= */

.messages {
    flex: 1;

    overflow-y: auto;

    padding: 25px 16px;

    display: flex;
    flex-direction: column;
    gap: 12px;

    scrollbar-width: thin;
    scrollbar-color: #222 transparent;
}


/* =========================================================
   MENSAGEM
========================================================= */

.message {
    max-width: 78%;

    padding: 10px 13px;

    font-size: 14px;
    line-height: 1.45;

    border-radius: 10px;

    animation: appear 0.2s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(4px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* Mensagem do usuário */

.message.user {
    align-self: flex-end;

    background: #1b1b1b;

    color: #eee;

    border-bottom-right-radius: 3px;
}


/* Mensagem do bot */

.message.bot {
    align-self: flex-start;

    background: #101010;

    color: #aaa;

    border: 1px solid #191919;

    border-bottom-left-radius: 3px;
}


/* =========================================================
   HORÁRIO
========================================================= */

.time {
    display: block;

    margin-top: 5px;

    font-size: 9px;

    color: #444;

    text-align: right;
}


/* =========================================================
   DIGITAÇÃO
========================================================= */

.typing {
    align-self: flex-start;

    display: none;

    padding: 9px 12px;

    background: #101010;

    border: 1px solid #191919;

    border-radius: 10px;

    color: #444;

    font-size: 12px;
}

.typing.visible {
    display: block;
}

.typing span {
    animation: blink 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: 0.2s;
}

.typing span:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes blink {
    0%, 100% {
        opacity: 0.2;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================================
   ÁREA DE ENVIO
========================================================= */

.input-area {
    flex-shrink: 0;

    padding: 12px;

    border-top: 1px solid #181818;

    background: #0a0a0a;

    display: flex;
    gap: 8px;
}


/* Campo */

.input {
    flex: 1;

    min-width: 0;

    height: 42px;

    padding: 0 14px;

    background: #111;

    border: 1px solid #1c1c1c;

    border-radius: 9px;

    outline: none;

    color: #ddd;

    font-size: 14px;

    transition: border 0.2s;
}

.input::placeholder {
    color: #444;
}

.input:focus {
    border-color: #292929;
}


/* Botão */

.send {
    width: 42px;
    height: 42px;

    border: 1px solid #1d1d1d;

    border-radius: 9px;

    background: #151515;

    color: #777;

    cursor: pointer;

    font-size: 17px;

    transition:
        background 0.2s,
        color 0.2s;
}

.send:hover {
    background: #1d1d1d;
    color: #aaa;
}

.send:active {
    transform: scale(0.96);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .chat {
        width: 100%;
        max-height: none;

        border: none;
    }

    .messages {
        padding: 20px 12px;
    }

    .message {
        max-width: 84%;
    }
}
</style>
</head>

<body>

<div class="chat">

    <!-- HEADER -->

    <header class="header">

        <div class="status"></div>

        <div class="header-title">
            desconhecido
        </div>

        <div class="header-status">
            online
        </div>

    </header>


    <!-- MENSAGENS -->

    <main class="messages" id="messages">

        <!--
            MENSAGEM DO BOT

            Para o futuro bot, basta criar:

            addBotMessage("texto");

        -->

        <div class="message bot">

            Você está aí?

            <span class="time">agora</span>

        </div>


        <div class="message bot">

            ...

            <span class="time">agora</span>

        </div>


        <!-- Indicador de digitação -->

        <div class="typing" id="typing">

            <span>•</span>
            <span>•</span>
            <span>•</span>

        </div>

    </main>


    <!-- ENVIO -->

    <form class="input-area" id="chatForm">

        <input
            id="messageInput"
            class="input"
            type="text"
            autocomplete="off"
            placeholder="Digite uma mensagem..."
        >

        <button
            class="send"
            type="submit"
            aria-label="Enviar"
        >
            ↑
        </button>

    </form>

</div>


<script>
/*
=========================================================
   SISTEMA DE CHAT
=========================================================

   Este JavaScript é somente o sistema básico necessário
   para testar a interface.

   O BOT NÃO está implementado.

   No futuro, seu bot poderá chamar:

       addBotMessage("mensagem");

   e a mensagem aparecerá automaticamente na interface.
=========================================================
*/


const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");
const typing = document.getElementById("typing");


/*
=========================================================
   HORÁRIO
=========================================================
*/

function getTime() {

    const now = new Date();

    return now.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit"
    });

}


/*
=========================================================
   ADICIONAR MENSAGEM DO USUÁRIO
=========================================================
*/

function addUserMessage(text) {

    if (!text.trim()) return;

    const message = document.createElement("div");

    message.className = "message user";

    message.innerHTML = `
        ${escapeHTML(text)}

        <span class="time">
            ${getTime()}
        </span>
    `;

    messages.insertBefore(message, typing);

    scrollToBottom();
}


/*
=========================================================
   ADICIONAR MENSAGEM DO BOT
=========================================================

   ESTA É A FUNÇÃO QUE O FUTURO BOT DEVERÁ USAR.

   Exemplo:

       addBotMessage("Eu estava esperando.");

=========================================================
*/

function addBotMessage(text) {

    const message = document.createElement("div");

    message.className = "message bot";

    message.innerHTML = `
        ${escapeHTML(text)}

        <span class="time">
            ${getTime()}
        </span>
    `;

    messages.insertBefore(message, typing);

    scrollToBottom();
}


/*
=========================================================
   INDICADOR DE DIGITAÇÃO
=========================================================
*/

function showTyping() {

    typing.classList.add("visible");

    scrollToBottom();

}


function hideTyping() {

    typing.classList.remove("visible");

}


/*
=========================================================
   SCROLL
=========================================================
*/

function scrollToBottom() {

    messages.scrollTop = messages.scrollHeight;

}


/*
=========================================================
   SEGURANÇA

   Evita interpretar mensagens como HTML.

   Isso será importante quando o bot receber conteúdo
   externo futuramente.
=========================================================
*/

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/*
=========================================================
   ENVIO

   Por enquanto, a mensagem apenas aparece no chat.

   NÃO existe resposta automática do bot.
=========================================================
*/

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const text = input.value.trim();

    if (!text) return;

    addUserMessage(text);

    input.value = "";

    input.focus();

});


/*
=========================================================
   ENTER

   O formulário já permite enviar pressionando Enter.
=========================================================
*/


/*
=========================================================
   FUTURO BOT

   O arquivo bot.js poderá fazer algo como:

       addBotMessage("...");

   ou:

       showTyping();

       setTimeout(() => {
           hideTyping();
           addBotMessage("Eu sei que você está aí.");
       }, 2000);

   A lógica do bot ficará completamente separada
   desta interface.
=========================================================
*/
</script>

</body>
  </html>
