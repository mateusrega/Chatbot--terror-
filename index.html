<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Chat</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    width: 100%;
    height: 100%;
}

body {
    width: 100%;
    min-height: 100%;

    background: #080808;
    color: #ddd;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;
}


/* =====================================================
   CHAT
===================================================== */

.chat {
    width: 100%;
    height: 100vh;
    height: 100dvh;

    display: flex;
    flex-direction: column;

    background: #080808;

    overflow: hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    width: 100%;

    min-height: 58px;

    padding:
        0
        clamp(12px, 4vw, 24px);

    display: flex;
    align-items: center;

    flex-shrink: 0;

    border-bottom: 1px solid #1b1b1b;

    background: #090909;
}


.status {
    width: 7px;
    height: 7px;

    flex-shrink: 0;

    margin-right: 10px;

    border-radius: 50%;

    background: #444;
}


.title {
    min-width: 0;

    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: clamp(13px, 3.5vw, 15px);
}


.online {
    margin-left: auto;

    flex-shrink: 0;

    color: #444;

    font-size: clamp(8px, 2.5vw, 10px);

    letter-spacing: 1px;
}


/* =====================================================
   ÁREA DE MENSAGENS
===================================================== */

.messages {
    width: 100%;

    flex: 1;

    min-height: 0;

    overflow-x: hidden;
    overflow-y: auto;

    padding:
        clamp(12px, 4vw, 24px);

    display: flex;
    flex-direction: column;

    gap: clamp(8px, 2vw, 12px);

    scroll-behavior: smooth;

    scrollbar-width: thin;
    scrollbar-color: #222 transparent;
}


/* =====================================================
   BALÕES
===================================================== */

.message {
    width: fit-content;

    max-width: min(75%, 600px);

    padding:
        clamp(9px, 2.5vw, 12px)
        clamp(11px, 3vw, 15px);

    border-radius: 10px;

    font-size:
        clamp(13px, 3.6vw, 15px);

    line-height: 1.45;

    overflow-wrap: anywhere;

    word-break: break-word;
}


.bot {
    align-self: flex-start;

    background: #101010;

    border: 1px solid #191919;

    color: #aaa;

    border-bottom-left-radius: 3px;
}


.user {
    align-self: flex-end;

    background: #1b1b1b;

    color: #eee;

    border-bottom-right-radius: 3px;
}


/* =====================================================
   HORÁRIO
===================================================== */

.time {
    display: block;

    margin-top: 4px;

    color: #444;

    font-size:
        clamp(8px, 2.2vw, 10px);

    text-align: right;
}


/* =====================================================
   DIGITANDO
===================================================== */

.typing {
    display: none;

    align-self: flex-start;

    padding:
        8px 12px;

    background: #101010;

    border: 1px solid #191919;

    border-radius: 10px;

    color: #444;

    font-size: 13px;
}


.typing.active {
    display: block;
}


/* =====================================================
   ÁREA DE ENVIO
===================================================== */

.input-area {
    width: 100%;

    flex-shrink: 0;

    display: flex;
    align-items: center;

    gap: clamp(6px, 2vw, 10px);

    padding:
        clamp(7px, 2vw, 12px)
        clamp(8px, 3vw, 16px);

    padding-bottom:
        max(
            clamp(7px, 2vw, 12px),
            env(safe-area-inset-bottom)
        );

    border-top: 1px solid #1b1b1b;

    background: #090909;
}


/* =====================================================
   INPUT
===================================================== */

.input {
    width: 100%;
    min-width: 0;

    height:
        clamp(40px, 10vw, 46px);

    padding:
        0 clamp(11px, 3vw, 15px);

    border: 1px solid #222;

    border-radius: 9px;

    outline: none;

    background: #111;

    color: #ddd;

    font-family: inherit;

    font-size:
        clamp(13px, 3.7vw, 15px);
}


.input::placeholder {
    color: #444;
}


.input:focus {
    border-color: #333;
}


/* =====================================================
   BOTÃO
===================================================== */

.send {
    width:
        clamp(40px, 11vw, 46px);

    height:
        clamp(40px, 11vw, 46px);

    flex-shrink: 0;

    border: 1px solid #222;

    border-radius: 9px;

    background: #151515;

    color: #aaa;

    font-size:
        clamp(16px, 5vw, 19px);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        background .15s,
        transform .1s;
}


.send:hover {
    background: #202020;
}


.send:active {
    transform: scale(.94);
}


/* =====================================================
   TELAS PEQUENAS
===================================================== */

@media (max-width: 400px) {

    .header {
        min-height: 52px;
    }

    .messages {
        padding: 10px;
    }

    .message {
        max-width: 88%;
    }

}


/* =====================================================
   TELAS GRANDES
===================================================== */

@media (min-width: 900px) {

    .chat {
        max-width: 700px;

        margin: 0 auto;

        border-left: 1px solid #151515;
        border-right: 1px solid #151515;
    }

}


/* =====================================================
   ALTURA MUITO PEQUENA
===================================================== */

@media (max-height: 500px) {

    .header {
        min-height: 45px;
    }

    .messages {
        padding-top: 8px;
        padding-bottom: 8px;
    }

    .input-area {
        padding-top: 6px;
        padding-bottom: 6px;
    }

    .input,
    .send {
        height: 38px;
    }

}

</style>
</head>


<body>


<div class="chat">


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="status"></div>

        <div class="title">
            desconhecido
        </div>

        <div class="online">
            online
        </div>

    </header>


    <!-- ================= MENSAGENS ================= -->

    <main
        class="messages"
        id="messages"
    >

        <div class="message bot">

            Você está aí?

            <span class="time">
                agora
            </span>

        </div>


        <div
            class="typing"
            id="typing"
        >
            ...
        </div>

    </main>


    <!-- ================= ENVIO ================= -->

    <form
        class="input-area"
        id="chatForm"
    >

        <input
            id="messageInput"
            class="input"
            type="text"
            autocomplete="off"
            placeholder="Digite uma mensagem..."
        >

        <button
            class="send"
            type="submit"
            aria-label="Enviar mensagem"
        >
            ↑
        </button>

    </form>


</div>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const form =
    document.getElementById("chatForm");

const input =
    document.getElementById("messageInput");

const messages =
    document.getElementById("messages");


/* =====================================================
   HORÁRIO
===================================================== */

function getTime() {

    const now = new Date();

    return now.toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   SEGURANÇA
===================================================== */

function escapeHTML(text) {

    const element =
        document.createElement("div");

    element.textContent = text;

    return element.innerHTML;

}


/* =====================================================
   ADICIONAR MENSAGEM
===================================================== */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.innerHTML =
        escapeHTML(text) +
        `<span class="time">${getTime()}</span>`;

    messages.appendChild(message);

    requestAnimationFrame(() => {

        messages.scrollTop =
            messages.scrollHeight;

    });

}


/* =====================================================
   MENSAGEM DO BOT
===================================================== */

function addBotMessage(text) {

    addMessage(text, "bot");

}


/* =====================================================
   ENVIO
===================================================== */

form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const text =
            input.value.trim();

        if (!text) {
            return;
        }

        addMessage(text, "user");

        input.value = "";

        input.focus();

    }
);


/* =====================================================
   FUTURO BOT

   O futuro bot.js poderá simplesmente utilizar:

       addBotMessage("Olá.");

   ou:

       showTyping();
       hideTyping();

===================================================== */


/* =====================================================
   TECLADO MOBILE

   Quando o teclado virtual abrir, tentamos manter
   a última mensagem visível.
===================================================== */

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        () => {

            requestAnimationFrame(() => {

                messages.scrollTop =
                    messages.scrollHeight;

            });

        }
    );

}

</script>

</body>
</html>
